# Builds the addon for every target, tests it, and - when run by hand with
# update-dist - opens a pull request that puts the builds into dist/, so the
# binaries in git always come from here.
#
# Every build and test step keeps its output in logs/; when one fails, the
# last step puts the errors in an annotation, readable on the run's page and
# through the GitHub API without signing in.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update-dist:
        description: Open a pull request that updates dist/ with these builds
        type: boolean
        default: false

env:
  # the Electron binary is only needed by the e2e tests, which do not run here
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: mkdir -p logs && npm ci
      - name: Build the addon (x64 and ARM64) and the gamepad driver
        run: |
          set -o pipefail
          { npm run build && npm run build -- --arch arm64 && npm run build:gamepad; } 2>&1 | tee logs/build.log
      - name: Test
        run: |
          set -o pipefail
          { npm test && npm run test:types && npm run test:native; } 2>&1 | tee logs/test.log
      # hosted runners run as administrator without UAC prompts, so the
      # driver can be installed and its tests run unattended
      - name: Test the gamepad driver
        run: |
          set -o pipefail
          npm run test:driver 2>&1 | tee logs/test-driver.log
      - name: Test with the driver installed
        run: |
          set -o pipefail
          { node -e "require('./dist/easy-control.cjs').Gamepad.installDriver().then(() => console.log('installed'))" && npm test; } 2>&1 | tee logs/test-with-driver.log
      - name: Report the failure
        if: failure()
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData "easy-control"
          foreach ($log in @("gamepad-setup.log", "gamepad-service.log")) {
              if (Test-Path (Join-Path $dir $log)) { Copy-Item (Join-Path $dir $log) logs/ }
          }
          & {
              "xinputhid.sys: " + (Test-Path "$env:windir\System32\drivers\xinputhid.sys")
              Get-Service -Name xinputhid, EasyControlGamepad -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
              Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -like "*EASYCONTROL*" } |
                  Format-Table Status, Class, InstanceId, Problem -AutoSize | Out-String -Width 200
          } *> logs/devices.log
          node .github/scripts/annotate.js "windows failed" (Get-ChildItem logs/*.log).FullName
      - uses: actions/upload-artifact@v5
        with:
          name: win32-x64
          path: dist/win32-x64
      - uses: actions/upload-artifact@v5
        with:
          name: win32-arm64
          path: dist/win32-arm64

  windows-arm:
    needs: windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: mkdir -p logs && npm ci
      - uses: actions/download-artifact@v5
        with:
          name: win32-arm64
          path: dist/win32-arm64
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee logs/test.log
      - name: Test the gamepad driver
        run: |
          set -o pipefail
          npm run test:driver 2>&1 | tee logs/test-driver.log
      - name: Test with the driver installed
        run: |
          set -o pipefail
          { node -e "require('./dist/easy-control.cjs').Gamepad.installDriver().then(() => console.log('installed'))" && npm test; } 2>&1 | tee logs/test-with-driver.log
      - name: Report the failure
        if: failure()
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData "easy-control"
          foreach ($log in @("gamepad-setup.log", "gamepad-service.log")) {
              if (Test-Path (Join-Path $dir $log)) { Copy-Item (Join-Path $dir $log) logs/ }
          }
          & {
              "xinputhid.sys: " + (Test-Path "$env:windir\System32\drivers\xinputhid.sys")
              Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -like "*EASYCONTROL*" } |
                  Format-Table Status, Class, InstanceId, Problem -AutoSize | Out-String -Width 200
          } *> logs/devices.log
          node .github/scripts/annotate.js "windows-arm failed" (Get-ChildItem logs/*.log).FullName

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: mkdir -p logs && npm ci
      - name: Build the addon (ARM64, and x64 cross-built)
        run: |
          set -o pipefail
          { npm run build -- --arch x64 && npm run build; } 2>&1 | tee logs/build.log
      - name: Test
        run: |
          set -o pipefail
          { npm test && npm run test:types && npm run test:native; } 2>&1 | tee logs/test.log
      - name: Report the failure
        if: failure()
        run: node .github/scripts/annotate.js "macos failed" logs/*.log
      - uses: actions/upload-artifact@v5
        with:
          name: darwin-arm64
          path: dist/darwin-arm64
      - uses: actions/upload-artifact@v5
        with:
          name: darwin-x64
          path: dist/darwin-x64

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64, node: 24, upload: true }
          - { runner: ubuntu-latest, target: linux-x64, node: 22, upload: false }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, node: 24, upload: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install the X11 libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxfixes-dev libxrandr-dev libxkbcommon0 xvfb xauth x11-xkb-utils
      - run: mkdir -p logs && npm ci
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee logs/build.log
      - name: Let the tests make virtual devices (uinput) and rumble the gamepad
        run: |
          sudo modprobe uinput
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee /etc/udev/rules.d/99-easy-control-test.rules
          echo 'KERNEL=="event*", ATTRS{name}=="Virtual Xbox 360 Controller", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-easy-control-test.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 0666 /dev/uinput
      - name: Test under Xvfb (X11)
        # nothing else has the keyboard here, so the typing tests may type
        env:
          EASYCONTROL_TYPING_TEST: "1"
          EASYCONTROL_RUMBLE_TEST: "1"
        run: |
          set -o pipefail
          { xvfb-run -a -s "-screen 0 1280x1024x24" npm test && npm run test:types && npm run test:native; } 2>&1 | tee logs/test.log
      - name: Report the failure
        if: failure()
        run: node .github/scripts/annotate.js "${{ matrix.target }} (Node ${{ matrix.node }}) failed" logs/*.log
      - if: matrix.upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}

  update-dist:
    if: github.event_name == 'workflow_dispatch' && inputs.update-dist
    needs: [windows, windows-arm, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - run: npm ci
      - name: Rebuild the JS loaders
        run: npm run build:js
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/update-dist
          title: Update dist/ with the CI builds
          commit-message: "dist: builds from CI run ${{ github.run_id }}"
          body: Builds of every target from run ${{ github.run_id }}, which built and tested them.
          add-paths: dist/**
